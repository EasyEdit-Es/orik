[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orik"
version = "1.1.0b1"
description = "Asistente IA local con búsqueda web"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Jorge Sánchez Villanueva" }]
dependencies = [
    "Flask>=3.0,<4.0",
    "requests>=2.31,<3.0",
    "python-dotenv>=1.0,<2.0",
    "ddgs>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
prod = ["gunicorn>=21.2"]

[tool.setuptools.packages.find]
include = ["orik*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".sessions", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.coverage.run]
source = ["orik"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
